<html>
  <head>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@latest?dev",
          "react-dom/client": "https://esm.sh/react-dom@latest/client?dev"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="text/javascript">
      // Seleciona uma div com a id "app"
      const app = document.getElementById('app');

      // Cria uma nova h1
      const header = document.createElement('h1');
 
      // Cria um nó de texto para a h1
      const text = 'Desenvolver. Visualizar. Enviar.';
      const headerContent = document.createTextNode(text);
 
      // Anexa o texto à h1
      header.appendChild(headerContent);
 
      // Coloca a h1 dentro da div
      app.appendChild(header);
    </script>
  </body>
</html>
